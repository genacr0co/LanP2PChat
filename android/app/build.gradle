plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.lanp2pchat"
    compileSdk 35

    defaultConfig {
        applicationId "com.lanp2pchat"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1"

        python {
            buildPython "python3.10"

            pip {
                install "fastapi==0.95.2"
                install "starlette==0.27.0"
                install "pydantic==1.10.13"
                install "uvicorn==0.22.0"
                install "aiosqlite"
                install "requests"
                install "websockets"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    tasks.whenTaskAdded { task ->
        if (task.name == "installDebugPythonRequirements") {
            task.dependsOn "mergeDebugNativeDebugMetadata"
        }

        if (task.name == "mergeDebugPythonSources") {
            task.dependsOn "installDebugPythonRequirements"
        }
    }

    sourceSets {
        main {
            python {
                // Берём корень проекта, но НЕ весь проект подряд.
                srcDir "../../"

                // Нужные Python-файлы из корня.
                include "*.py"

                // Нужная backend-папка.
                include "backend/**/*.py"

                // ВАЖНО: не тащим desktop main.py, там pywebview/subprocess.
                exclude "main.py"

                // ВАЖНО: не тащим Android-проект внутрь Python sources,
                // иначе будет бесконечный путь android/app/build/python/sources/debug/...
                exclude "android/**"

                // Мусор и окружения.
                exclude "venv/**"
                exclude ".venv/**"
                exclude "__pycache__/**"
                exclude "**/__pycache__/**"
                exclude "**/*.pyc"
                exclude ".git/**"
                exclude "build/**"
                exclude "dist/**"
                exclude "node_modules/**"
            }

            assets {
                // Фронт кладём в Android assets.
                srcDirs "../../static"
            }
        }
    }
}