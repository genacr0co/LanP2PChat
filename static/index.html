<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LAN P2P Chat</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/sidebar.css">
    <link rel="stylesheet" href="/static/css/chat.css">
    <link rel="stylesheet" href="/static/css/composer.css">
    <link rel="stylesheet" href="/static/css/modal.css">
    <link rel="stylesheet" href="/static/css/emoji.css">
    <link rel="stylesheet" href="/static/css/join.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body class="loading">

<div class="layout">

    <aside class="sidebar">

        <div class="sidebar-header">
            <h2>Чаты</h2>
            <button id="createRoomBtn" title="Создать группу">+</button>
        </div>

        <div class="tabs">
            <button id="groupsTab" class="active">Комнаты</button>
            <button id="dmTab">Личные</button>
        </div>

        <div id="roomsList" class="rooms-list"></div>

        <div class="online-panel">
            <h3>Онлайн — нажми, чтобы написать</h3>
            <div id="onlineList"></div>
        </div>

    </aside>

    <div class="app">

        <header class="header">
            <div>
                <h1 id="roomTitle">LAN Chat</h1>
                <p id="status">Запуск...</p>
            </div>
        </header>

        <main id="chat" class="chat"></main>

        <form id="form" class="composer">
            <div class="composer-wrap">
                <button type="button" id="emojiBtn" class="emoji-btn">😊</button>
                <textarea id="messageInput" placeholder="Написать сообщение..."></textarea>
                <button type="submit" class="send-btn">➤</button>
                <div id="emojiPicker" class="emoji-picker"></div>
            </div>
        </form>

    </div>

</div>

<div id="nameModal" class="modal">
    <div class="modal-card">
        <h2>Ваше имя</h2>
        <input id="nameInput" placeholder="Например: Marat">
        <button id="saveNameBtn">Продолжить</button>
    </div>
</div>

<div id="roomModal" class="modal">
    <div class="modal-card">
        <h2>Создать группу</h2>
        <input id="roomNameInput" placeholder="Название группы">
        <button id="saveRoomBtn">Создать</button>
        <button id="cancelRoomBtn" class="secondary-btn">Отмена</button>
    </div>
</div>

<audio id="notifySound" src="/static/notify.mp3" preload="auto"></audio>

<script src="/static/src/state.js"></script>
<script src="/static/src/utils.js"></script>
<script src="/static/src/dw_smiley.js"></script>

<script src="/static/src/config.js"></script>
<script src="/static/src/direct.js"></script>
<script src="/static/src/messages.js"></script>
<script src="/static/src/rooms.js"></script>
<script src="/static/src/socket.js"></script>
<script src="/static/src/emoji.js"></script>
<script src="/static/src/status.js"></script>
<script src="/static/src/app.js"></script>

</body>
</html>
